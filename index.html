<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAS DETECTOR</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0a0a12;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 12px;
    background-image: radial-gradient(ellipse at top, #0a2a1a 0%, #0a0a12 70%);
}
.container { max-width: 500px; margin: 0 auto; }
.header { text-align: center; padding: 20px 0 24px; }
.header .logo {
    font-size: 28px; font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(135deg, #00ff88, #00cc66);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header .sub { font-size: 9px; color: #666; letter-spacing: 4px; margin-top: 4px; }
.main-card {
    background: rgba(15,15,25,0.9); border: 1px solid #2a2a3a;
    border-radius: 20px; padding: 24px 18px; margin-bottom: 14px; text-align: center;
}
.level-label { font-size: 11px; color: #666; letter-spacing: 3px; text-transform: uppercase; }
.level-value {
    font-size: 80px; font-weight: 900; letter-spacing: -3px;
    margin: 8px 0; transition: color 0.3s;
    color: #00ff88; text-shadow: 0 0 30px rgba(0,255,136,0.5);
}
.level-max { font-size: 28px; color: #444; }
.status-text {
    font-size: 13px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; margin-top: 10px;
    color: #00ff88;
}
.card {
    background: rgba(15,15,25,0.9); border: 1px solid #2a2a3a;
    border-radius: 16px; padding: 18px; margin-bottom: 14px;
}
.card h3 {
    font-size: 12px; font-weight: 700; letter-spacing: 2px;
    color: #888; text-transform: uppercase; margin-bottom: 14px;
}
.chart-container {
    position: relative;
    height: 200px;
    width: 100%;
}
.chart-container canvas {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
}
.history-list { max-height: 250px; overflow-y: auto; }
.history-item {
    display: flex; justify-content: space-between; padding: 10px 0;
    border-bottom: 1px solid #1a1a2a; font-size: 12px;
}
.history-item:last-child { border-bottom: none; }
.history-item .time { color: #666; font-size: 11px; font-family: monospace; }
.history-item .val { font-weight: 700; padding: 3px 10px; border-radius: 10px; font-size: 11px; }
.history-item .val.safe { background: rgba(0,255,136,0.1); color: #00ff88; }
.history-item .val.warn { background: rgba(255,204,0,0.1); color: #ffcc00; }
.history-item .val.danger { background: rgba(255,51,85,0.1); color: #ff3355; }
.team-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px; margin-top: 10px;
}
.team-item {
    background: rgba(255,255,255,0.03); border: 1px solid #2a2a3a;
    border-radius: 12px; padding: 10px 6px; text-align: center;
}
.team-name { font-size: 10px; font-weight: 700; color: #fff; margin-bottom: 5px; letter-spacing: 1px; }
.team-role { display: inline-block; font-size: 7px; font-weight: 700; padding: 3px 7px; border-radius: 10px; letter-spacing: 1px; }
.team-role.coding { background: rgba(0,212,255,0.1); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }
.team-role.assembly { background: rgba(255,204,0,0.1); color: #ffcc00; border: 1px solid rgba(255,204,0,0.3); }
.team-role.documentation { background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
.team-role.ppt { background: rgba(255,107,53,0.1); color: #ff6b35; border: 1px solid rgba(255,107,53,0.3); }
.team-role.poster { background: rgba(255,51,85,0.1); color: #ff3355; border: 1px solid rgba(255,51,85,0.3); }
.team-role.module { background: rgba(168,85,247,0.1); color: #a855f7; border: 1px solid rgba(168,85,247,0.3); }
.footer { text-align: center; font-size: 10px; color: #333; letter-spacing: 2px; padding: 20px 0 10px; }
.empty { text-align: center; padding: 30px 10px; color: #444; font-size: 12px; font-style: italic; }

/* RATING */
.rating-input { margin-bottom: 12px; }
.rating-input input {
    width: 100%; padding: 12px 14px;
    background: #0a0a12; border: 1px solid #2a2a3a;
    border-radius: 10px; color: #fff; font-size: 13px;
    font-family: 'Segoe UI', Arial, sans-serif; outline: none;
}
.rating-input input:focus { border-color: #00ff88; }
.stars {
    display: flex; justify-content: center; gap: 8px; margin-bottom: 12px;
}
.star {
    font-size: 36px; cursor: pointer; color: #333;
    transition: all 0.2s; user-select: none;
}
.star:hover, .star.active {
    color: #ffcc00; text-shadow: 0 0 20px rgba(255,204,0,0.7);
    transform: scale(1.1);
}
.btn-submit {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #00ff88, #00cc66);
    color: #000; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; cursor: pointer;
    font-family: 'Segoe UI', Arial, sans-serif;
}
.btn-submit:active { transform: scale(0.97); }
.rating-list { max-height: 250px; overflow-y: auto; }
.rating-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid #1a1a2a; font-size: 12px;
